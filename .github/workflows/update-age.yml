name: Update Age

on:
  schedule:
    - cron: "35 17 * * *" # 00:05 Asia/Yangon (UTC+6:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update age in README.md
        run: |
          python3 - <<'EOF'
          import datetime, pathlib, re, zoneinfo

          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Yangon")).date()
          birth = datetime.date(2005, 6, 18)
          age = today.year - birth.year - ((today.month, today.day) < (birth.month, birth.day))

          readme = pathlib.Path("README.md")
          original = readme.read_text(encoding="utf-8")
          updated = re.sub(
              r"(<!-- AGE:START -->)\d+(<!-- AGE:END -->)",
              rf"\g<1>{age}\g<2>",
              original,
          )
          if updated != original:
              readme.write_text(updated, encoding="utf-8")
          EOF

      - name: Commit updated README if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update age in README"
            git push
          fi
